<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Ducks</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="index.js" defer></script>
</head>
<body>
    <header>
        <h1>Book Ducks</h1>
        <div id="user-info"></div>
        <a id="profile-link" href="profile.html" class="nav-button" style="display:none;">Profile</a>
        <button id="logoutBtn">Logout</button>
    </header>

    <section id="auth-section">
        <div>
            <h2>Login</h2>
            <label for="identifier">Login</label>
            <input type="text" id="identifier" placeholder="Username / Email">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn">Login</button>
        </div>
        <div>
            <h2>Register</h2>
            <label for="registerUsername">Username</label>
            <input type="text" id="registerUsername" placeholder="Username">
            <label for="registerEmail">Email</label>
            <input type="email" id="registerEmail" placeholder="Email">
            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword" placeholder="Password">
            <button id="registerBtn">Register</button>
        </div>
    </section>
    <hr>

    <section>
        <h2>Books</h2>
        <div id="books-container"></div>
    </section>

    <section id="admin-panel">
        <h2>Admin Panel - Add Books</h2>

        <input id="book-title" placeholder="Title">
        <input id="book-author" placeholder="Author">
        <input id="book-pages" placeholder="Pages">
        <input id="book-date" placeholder="Release date">

        <input type="file" id="book-image">

        <button onclick="createBook()">Create Book</button>
    </section>
</body>
</html>
